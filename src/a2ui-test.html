<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>A2UI Renderer PoC 测试</title>
    <style>
        body { font-family: -apple-system, sans-serif; margin: 0; background: #0f172a; color: #e2e8f0; }
        .test-container { display: flex; height: 100vh; }
        .left-panel { width: 420px; background: #1e293b; padding: 16px; overflow-y: auto; border-right: 1px solid #334155; }
        .right-panel { flex: 1; padding: 16px; display: flex; flex-direction: column; }
        h2 { color: #818cf8; font-size: 16px; margin: 0 0 12px; }
        .controls { margin-bottom: 16px; }
        .controls button { padding: 8px 16px; margin-right: 8px; border-radius: 6px; border: none; cursor: pointer; font-size: 13px; font-weight: 500; }
        .btn-primary { background: #6366f1; color: white; }
        .btn-primary:hover { background: #818cf8; }
        .btn-secondary { background: #334155; color: #94a3b8; }
        .btn-secondary:hover { background: #475569; color: white; }
        .btn-stream { background: #059669; color: white; }
        .btn-stream:hover { background: #10b981; }
        .jsonl-editor { width: 100%; height: 300px; background: #0f172a; color: #a5f3fc; border: 1px solid #334155;
            border-radius: 8px; padding: 12px; font-family: 'Fira Code', monospace; font-size: 11px; resize: vertical; }
        .preview-frame { flex: 1; border: none; border-radius: 8px; background: white; }
        .status-bar { padding: 8px 12px; background: #1e293b; border-radius: 6px; margin-top: 8px; font-size: 12px; color: #94a3b8; }
        .status-bar .count { color: #34d399; font-weight: 600; }
    </style>
</head>
<body>
    <div class="test-container">
        <div class="left-panel">
            <h2>A2UI PoC 测试</h2>
            <div class="controls">
                <button class="btn-primary" onclick="renderAll()">一次性渲染</button>
                <button class="btn-stream" onclick="streamRender()">流式模拟渲染</button>
                <button class="btn-secondary" onclick="resetRenderer()">重置</button>
            </div>
            <textarea class="jsonl-editor" id="jsonlInput"></textarea>
            <div class="status-bar" id="statusBar">组件数: <span class="count">0</span> | 状态: 空闲</div>
        </div>
        <div class="right-panel">
            <iframe class="preview-frame" id="previewFrame"></iframe>
        </div>
    </div>

    <script src="/src/static/js/a2ui-renderer.js"></script>
    <script>
        var renderer = new A2UIRenderer();

        // 模拟仪表盘页面的 JSONL 数据
        var DASHBOARD_JSONL = [
            '{"type":"marker","marker":"page-start","page":"模型部署配置","index":0,"total":1,"designTokens":{"primaryColor":"#4f46e5","secondaryColor":"#10b981","bgMode":"light"}}',
            '{"type":"component","id":"root","component":"Page","style":"min-h-screen bg-gray-50","props":{},"children":["nav-1","body-1"]}',
            '{"type":"component","id":"nav-1","component":"NavBar","style":"bg-white shadow-sm px-6 py-3 flex items-center justify-between sticky top-0 z-10","props":{"title":"模型部署配置","logo":"fa-cube"},"children":["nav-right-1"]}',
            '{"type":"component","id":"nav-right-1","component":"FlexRow","style":"items-center gap-3","props":{},"children":["search-1","user-1"]}',
            '{"type":"component","id":"search-1","component":"Input","style":"","props":{"placeholder":"搜索模型...","prepend":"fa-search"},"children":[]}',
            '{"type":"component","id":"user-1","component":"Avatar","style":"w-8 h-8 text-sm bg-indigo-500","props":{"text":"A","alt":"Admin"},"children":[]}',
            '{"type":"component","id":"body-1","component":"FlexColumn","style":"flex-1 p-6 gap-6 max-w-7xl mx-auto w-full","props":{},"children":["stats-1","card-1"]}',
            '{"type":"component","id":"stats-1","component":"FlexRow","style":"gap-4 flex-wrap","props":{},"children":["stat-1","stat-2","stat-3","stat-4"]}',
            '{"type":"component","id":"stat-1","component":"StatRow","style":"flex-1 min-w-[200px]","props":{"label":"总模型数","value":"128","icon":"fa-cube","trend":"+12.5%","trendUp":true},"children":[]}',
            '{"type":"component","id":"stat-2","component":"StatRow","style":"flex-1 min-w-[200px]","props":{"label":"运行中","value":"96","icon":"fa-play-circle","trend":"+3.2%","trendUp":true},"children":[]}',
            '{"type":"component","id":"stat-3","component":"StatRow","style":"flex-1 min-w-[200px]","props":{"label":"已停止","value":"24","icon":"fa-stop-circle","trend":"-5.1%","trendUp":false},"children":[]}',
            '{"type":"component","id":"stat-4","component":"StatRow","style":"flex-1 min-w-[200px]","props":{"label":"部署成功率","value":"98.5%","icon":"fa-check-circle","trend":"+0.8%","trendUp":true},"children":[]}',
            '{"type":"component","id":"card-1","component":"Card","style":"","props":{"title":"模型列表","extra":"<button class=\\"px-4 py-2 text-sm bg-indigo-500 text-white rounded-lg hover:bg-indigo-600\\"><i class=\\"fas fa-plus mr-1\\"></i>新增部署</button>"},"children":["table-1"]}',
            '{"type":"component","id":"table-1","component":"Table","style":"","props":{"columns":[{"key":"name","label":"模型名称"},{"key":"type","label":"类型"},{"key":"status","label":"状态","render":"badge"},{"key":"gpu","label":"GPU"},{"key":"createTime","label":"创建时间"},{"key":"action","label":"操作"}],"data":[{"name":"GPT-4-Turbo","type":"大语言模型","status":"success","gpu":"A100 x4","createTime":"2024-01-15","action":"查看"},{"name":"BERT-Large","type":"NLP模型","status":"warning","gpu":"V100 x2","createTime":"2024-02-20","action":"查看"},{"name":"ResNet-50","type":"图像分类","status":"success","gpu":"T4 x1","createTime":"2024-03-08","action":"查看"},{"name":"Whisper-v3","type":"语音识别","status":"danger","gpu":"A100 x2","createTime":"2024-03-15","action":"查看"},{"name":"Stable Diffusion XL","type":"图像生成","status":"success","gpu":"A100 x4","createTime":"2024-04-01","action":"查看"}],"pagination":{"total":128,"pageSize":10}},"children":[]}',
            '{"type":"marker","marker":"page-end","page":"模型部署配置"}'
        ];

        // 模拟带侧边栏的布局
        var SIDEBAR_JSONL = [
            '{"type":"marker","marker":"page-start","page":"数据管理平台","index":0,"total":1,"designTokens":{"primaryColor":"#3b82f6","secondaryColor":"#f59e0b","bgMode":"light"}}',
            '{"type":"component","id":"root","component":"Page","style":"min-h-screen bg-gray-100 flex","props":{},"children":["sidebar-1","main-1"]}',
            '{"type":"component","id":"sidebar-1","component":"SideBar","style":"bg-white shadow-sm h-screen sticky top-0","props":{"width":"w-56","items":[{"label":"仪表盘","icon":"fa-chart-line","active":true},{"label":"数据源","icon":"fa-database"},{"label":"模型管理","icon":"fa-cube"},{"label":"任务中心","icon":"fa-tasks"},{"label":"系统设置","icon":"fa-cog"}]},"children":[]}',
            '{"type":"component","id":"main-1","component":"FlexColumn","style":"flex-1 min-h-screen","props":{},"children":["topbar-1","content-1"]}',
            '{"type":"component","id":"topbar-1","component":"NavBar","style":"bg-white shadow-sm px-6 py-3 flex items-center justify-between","props":{"title":"仪表盘","breadcrumbs":[{"label":"首页"},{"label":"数据管理"},{"label":"仪表盘"}]},"children":["actions-1"]}',
            '{"type":"component","id":"actions-1","component":"FlexRow","style":"items-center gap-2","props":{},"children":["btn-1","avatar-1"]}',
            '{"type":"component","id":"btn-1","component":"Button","style":"","props":{"label":"导出报告","variant":"primary","icon":"fa-download","size":"sm"},"children":[]}',
            '{"type":"component","id":"avatar-1","component":"Avatar","style":"w-8 h-8 text-sm bg-blue-500","props":{"text":"Z"},"children":[]}',
            '{"type":"component","id":"content-1","component":"FlexColumn","style":"p-6 gap-6","props":{},"children":["stats-1","chart-row-1","card-table-1"]}',
            '{"type":"component","id":"stats-1","component":"Grid","style":"","props":{"cols":4,"gap":4},"children":["s1","s2","s3","s4"]}',
            '{"type":"component","id":"s1","component":"StatRow","style":"","props":{"label":"日活跃用户","value":"8,492","icon":"fa-users","trend":"+18.2%","trendUp":true},"children":[]}',
            '{"type":"component","id":"s2","component":"StatRow","style":"","props":{"label":"数据处理量","value":"2.4TB","icon":"fa-hdd","trend":"+5.7%","trendUp":true},"children":[]}',
            '{"type":"component","id":"s3","component":"StatRow","style":"","props":{"label":"API 调用","value":"156万","icon":"fa-code","trend":"-2.1%","trendUp":false},"children":[]}',
            '{"type":"component","id":"s4","component":"StatRow","style":"","props":{"label":"系统可用率","value":"99.97%","icon":"fa-shield-alt","trend":"+0.02%","trendUp":true},"children":[]}',
            '{"type":"component","id":"chart-row-1","component":"Grid","style":"","props":{"cols":2,"gap":4},"children":["chart-1","chart-2"]}',
            '{"type":"component","id":"chart-1","component":"Chart","style":"","props":{"chartType":"bar","height":280},"children":[]}',
            '{"type":"component","id":"chart-2","component":"Chart","style":"","props":{"chartType":"line","height":280},"children":[]}',
            '{"type":"component","id":"card-table-1","component":"Card","style":"","props":{"title":"最近任务"},"children":["tabs-1"]}',
            '{"type":"component","id":"tabs-1","component":"Tabs","style":"","props":{"items":[{"label":"全部","active":true},{"label":"运行中"},{"label":"已完成"},{"label":"失败"}]},"children":[]}',
            '{"type":"marker","marker":"page-end","page":"数据管理平台"}'
        ];

        // 初始化编辑器
        var editor = document.getElementById('jsonlInput');
        editor.value = DASHBOARD_JSONL.join('\n');

        function renderAll() {
            renderer.reset();
            var text = editor.value;
            var count = renderer.handleBlockBatch(text);
            var html = renderer.toHtml();
            var frame = document.getElementById('previewFrame');
            frame.srcdoc = html || '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#999;">渲染失败 — 无有效组件树</div>';
            updateStatus(count);
        }

        function streamRender() {
            renderer.reset();
            var lines = editor.value.split('\n').filter(function(l) { return l.trim(); });
            var frame = document.getElementById('previewFrame');
            var index = 0;

            function next() {
                if (index >= lines.length) {
                    updateStatus(lines.length);
                    return;
                }
                renderer.handleBlock(lines[index]);
                index++;

                var html = renderer.toHtml();
                if (html) {
                    frame.srcdoc = html;
                }
                updateStatus(index, true);

                setTimeout(next, 200);
            }
            next();
        }

        function resetRenderer() {
            renderer.reset();
            document.getElementById('previewFrame').srcdoc = '';
            updateStatus(0);
        }

        function updateStatus(count, streaming) {
            var status = renderer.getStatus();
            var bar = document.getElementById('statusBar');
            bar.innerHTML = '组件数: <span class="count">' + status.componentCount + '</span>' +
                ' | 根节点: ' + (status.hasRoot ? '✓' : '✗') +
                ' | 页面: ' + (status.pageName || '—') +
                ' | 完成: ' + (status.isComplete ? '✓' : '✗') +
                ' | ' + (streaming ? '流式渲染中...' : '空闲');
        }

        // 页面加载后自动渲染
        setTimeout(renderAll, 300);
    </script>
</body>
</html>
